name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so a release only publishes after the full matrix passes on its tag.
  workflow_call:

# The package is developed on the newest toolchain and shipped for old ones. Each job proves one
# side of that: `test` runs the dev toolchain, `runtime` and `types` run what npm users receive.

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run lint:package

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      # Importing one function must not pull in the rest. This breaks silently when a bundler can't
      # see `sideEffects: false` (see scripts/stamp-dist.mjs), so check it on the real tarball.
      - name: tree-shaking
        run: |
          tarball="$PWD/$(ls cooking-units-*.tgz)"
          mkdir treeshake && cd treeshake && npm init -y >/dev/null
          npm install "$tarball" esbuild
          echo "import { parseAmount } from 'cooking-units'; console.log(parseAmount('1½'));" > entry.mjs
          npx esbuild entry.mjs --bundle --minify --format=esm --outfile=out.js
          if grep -q eetlepel out.js; then echo "parseAmount pulled in the alias table"; exit 1; fi
          echo "parseAmount alone: $(gzip -9 < out.js | wc -c) bytes gzipped"
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: cooking-units-*.tgz

  # The published package on every Node version `engines` promises, with no dev tooling installed.
  runtime:
    name: runtime (Node ${{ matrix.node }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: require() and import
        run: |
          tarball="$PWD/$(ls cooking-units-*.tgz)"
          mkdir consumer && cd consumer && npm init -y >/dev/null
          npm install "$tarball"
          node -e "const u = require('cooking-units'); if (u.normalizeUnit('eetlepels') !== 'tbsp') process.exit(1); console.log('require ok')"
          node --input-type=module -e "import { localizeUnit } from 'cooking-units'; if (localizeUnit('tbsp', 'nl') !== 'el') process.exit(1); console.log('import ok')"
          # The JSON for ports, through its subpath exports, stamped with the version it shipped in.
          node -e "
            const { version } = require('cooking-units/package.json');
            for (const file of ['units', 'test-vectors']) {
              const data = require('cooking-units/data/' + file + '.json');
              if (data.version !== version || typeof data.schema !== 'number') process.exit(1);
            }
            console.log('data ok')"

  # The published declarations, compiled by older TypeScript in CommonJS and ESM projects.
  types:
    name: types (${{ matrix.fixture }}, TS ${{ matrix.typescript }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [cjs, esm]
        typescript: ['4.7', '5.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tarball
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: compat/run.sh ${{ matrix.fixture }} ${{ matrix.typescript }} cooking-units-*.tgz
