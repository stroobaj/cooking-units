name: Release

# Publishing a GitHub Release stages that version on npm. A maintainer then approves it with 2FA
# (npmjs.com → Staged Packages, or `npm stage approve <id>`), and only then is it public.
#
# Uses npm trusted publishing: npm trusts this workflow, in this repo, through GitHub's OIDC token,
# so there is no npm token stored anywhere. Every version gets a provenance attestation linking it
# to the commit and the run that built it. The trusted publisher is configured on npmjs.com under
# the package's settings and names this file, `release.yml` — renaming it breaks publishing. It has
# the stage permission only, so this workflow cannot publish without a human approving.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The full CI matrix on the tagged commit, including the old-Node and old-TypeScript checks
  # that `prepublishOnly` does not cover.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Only `v*` tags may deploy to this environment (set in the repo's environment settings).
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in a job that can publish: a poisoned cache would ship.
          package-manager-cache: false

      - name: Release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      # `npm stage publish` needs npm 11.15+; Node 24 may ship an older npm 11. Pinned, because this
      # job can publish.
      - run: npm install -g npm@11.19.1

      - run: npm ci

      # Check, test, build and lint:package. Run explicitly: the build must exist before staging,
      # whether or not `npm stage publish` runs the prepublishOnly hook itself.
      - run: npm run prepublishOnly

      # A release marked as a pre-release on GitHub goes to the `next` dist-tag instead of `latest`.
      - run: npm stage publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
